apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
  namespace: model-factory
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: rtx4060
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Equal
      value: rtx2070
      effect: NoSchedule
  containers:
    - name: gpu-test
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
