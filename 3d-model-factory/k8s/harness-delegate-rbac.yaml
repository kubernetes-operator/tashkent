apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-factory-runner
  namespace: model-factory
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - persistentvolumeclaims
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-factory-runner-binding
  namespace: model-factory
subjects:
  - kind: ServiceAccount
    name: default
    namespace: harness-delegate
roleRef:
  kind: Role
  name: model-factory-runner
  apiGroup: rbac.authorization.k8s.io
